name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install sandrun
        run: pip install sandrun

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [akash] is needed alongside [dev] because pyyaml/paramiko live
          # there, and tests/unit/test_akash.py imports yaml at module load.
          pip install -e ".[akash,dev]"

      - name: Lint
        run: ruff check src/

      - name: Run tests
        run: pytest tests/unit/ -v
